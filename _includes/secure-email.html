<!-- created on 28.01.2026, hiding email from scrapers -->

<a href="#" 
   class="secure-email-reveal" 
   data-user="{{ include.user }}" 
   data-domain="{{ include.domain }}"
   rel="nofollow noopener noreferrer">
  {{ include.text | default: "Show Email" }}
</a>

<script>
  if (!window.secureEmailRevealLoaded) {
    window.secureEmailRevealLoaded = true;

    document.addEventListener('click', function(e) {
      if (e.target.closest('.secure-email-reveal')) {
        const link = e.target.closest('.secure-email-reveal');
        
        if (!link.classList.contains('revealed')) {
          e.preventDefault();
          
          const user = link.getAttribute('data-user');
          const domain = link.getAttribute('data-domain');
          const address = user + '@' + domain;
          
          link.innerText = address;
          
          link.href = 'mailto:' + address;
          
          link.classList.add('revealed');
        }
      }
    });
  }
</script>
