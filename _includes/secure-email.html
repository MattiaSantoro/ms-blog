<!-- created on 28.01.2026, hiding email from scrapers -->

<a href="#" 
   class="secure-email" 
   data-user="{{ include.user }}" 
   data-domain="{{ include.domain }}"
   {% if include.reveal %}data-reveal="true"{% endif %}
   rel="nofollow noopener noreferrer">
  {{ include.text | default: "Email Me" }}
</a>

<script>
  if (!window.secureEmailLoaded) {
    window.secureEmailLoaded = true;

    document.addEventListener('click', function(e) {
      if (e.target.closest('.secure-email')) {
        const link = e.target.closest('.secure-email');
        if (link.getAttribute('href') === '#') {
          e.preventDefault();
          const address = link.getAttribute('data-user') + '@' + link.getAttribute('data-domain');
          link.href = 'mailto:' + address;
          window.location.href = 'mailto:' + address;
        }
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      const revealLinks = document.querySelectorAll('.secure-email[data-reveal="true"]');
      revealLinks.forEach(function(link) {
        link.innerText = link.getAttribute('data-user') + '@' + link.getAttribute('data-domain');
      });
    });
  }
</script>
